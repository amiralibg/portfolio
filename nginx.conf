server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The site has exactly two real paths — "/" and "/admin" — because
    # navigation is hash-based (#projects/doran). A blanket SPA fallback would
    # therefore answer every typo and every stale inbound link with "200 OK,
    # here is the home page", which Google reads as a soft 404 and holds
    # against the site. Unmatched paths get index.html with a 404 status
    # instead: the app still boots, the status code tells the truth.
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
    }

    # Regex so /admin and /admin/ both land here — Root.tsx strips the trailing
    # slash before it compares the pathname.
    location ~ ^/admin/?$ {
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Unmatched paths still get the app — the SPA has to boot to render its own
    # "not found" state — but with the 404 status attached rather than a 200.
    error_page 404 /404.html;
    location = /404.html {
        internal;
        root /usr/share/nginx/html;
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
    }

    # Vite emits site.webmanifest, which nginx's mime.types does not know; it
    # ships as application/octet-stream and Chrome refuses to parse it.
    location = /site.webmanifest {
        default_type application/manifest+json;
    }

    # Without this, /api/* falls through to the SPA fallback above and the
    # failure is baffling: GET returns 200 with index.html, and POST returns a
    # bare nginx "405 Not Allowed" because you cannot POST to a static file —
    # neither of which hints that the API URL was simply never configured.
    #
    # Reaching this means VITE_CONTACT_API was not set at build time AND the
    # proxy block below is not enabled. Replace this whole block with that
    # proxy if you want the API served same-origin.
    location /api/ {
        default_type application/json;
        return 503 '{"error":"Contact API is not wired up for this origin. Set the VITE_CONTACT_API build arg, or enable the /api/ proxy in nginx.conf."}';
    }

    # Cache hashed assets aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # --- Contact API ---------------------------------------------------------
    # Two ways to connect the API. Pick one; see server/README.md.
    #
    # Option A (separate domain, the default): deploy the API at
    # api.amiralibg.xyz and build this image with
    #   VITE_CONTACT_API=https://api.amiralibg.xyz/api/contact
    # Leave the block below commented, and list https://amiralibg.xyz in the
    # API's CORS_ORIGINS.
    #
    # Option B (same origin, no CORS at all): put the API on the same Docker
    # network, uncomment below, and leave VITE_CONTACT_API empty so the
    # frontend posts to /api/contact.
    #
    # The `resolver` + variable `$upstream` matter: with a literal hostname in
    # proxy_pass, nginx resolves it once at startup and REFUSES TO BOOT if the
    # API container isn't up — taking the whole portfolio down with it. Going
    # through a variable defers resolution to request time, so a dead API means
    # a failing contact form instead of a dead site.
    #
    # location /api/ {
    #     resolver           127.0.0.11 valid=10s;  # Docker's embedded DNS
    #     set $upstream      http://contact-api:8000;
    #     proxy_pass         $upstream;
    #     proxy_http_version 1.1;
    #     proxy_set_header   Host              $host;
    #     proxy_set_header   X-Real-IP         $remote_addr;
    #     proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header   X-Forwarded-Proto $scheme;
    # }
}
