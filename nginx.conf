server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: serve index.html for any unmatched route
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed assets aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # --- Contact API ---------------------------------------------------------
    # Two ways to connect the API. Pick one; see server/README.md.
    #
    # Option A (separate domain, the default): deploy the API at
    # api.amiralibg.xyz and build this image with
    #   VITE_CONTACT_API=https://api.amiralibg.xyz/api/contact
    # Leave the block below commented, and list https://amiralibg.xyz in the
    # API's CORS_ORIGINS.
    #
    # Option B (same origin, no CORS at all): put the API on the same Docker
    # network, uncomment below, and leave VITE_CONTACT_API empty so the
    # frontend posts to /api/contact.
    #
    # The `resolver` + variable `$upstream` matter: with a literal hostname in
    # proxy_pass, nginx resolves it once at startup and REFUSES TO BOOT if the
    # API container isn't up — taking the whole portfolio down with it. Going
    # through a variable defers resolution to request time, so a dead API means
    # a failing contact form instead of a dead site.
    #
    # location /api/ {
    #     resolver           127.0.0.11 valid=10s;  # Docker's embedded DNS
    #     set $upstream      http://contact-api:8000;
    #     proxy_pass         $upstream;
    #     proxy_http_version 1.1;
    #     proxy_set_header   Host              $host;
    #     proxy_set_header   X-Real-IP         $remote_addr;
    #     proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header   X-Forwarded-Proto $scheme;
    # }
}
